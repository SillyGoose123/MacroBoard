[package]
name = "firmware"
version = "0.1.2"
edition = "2024"

[[bin]]
name = "firmware"
path = "src/main.rs"
test = false
doctest = false
bench = false

# to remove defmt stuff in release
[profile.release]
debug = 2
codegen-units = 1
lto = "fat"
opt-level = "z"

[features]
XIAO=[]

[dependencies]
# embassy base
embassy-sync = "0.8.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "critical-section-impl", "time-driver", "defmt", "boot2-w25q080", "qspi-as-gpio"] }

# log & panic
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# embedded runtime
#cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
critical-section = "1.2"
embedded-alloc = "0.7.0"


# Usb
embassy-usb = { version = "0.6.0", features = ["defmt"] }
usbd-hid = "0.10.2" # This version is required to be compatible with embassy-usb

# Leds
smart-leds = "0.4"

# To create frontend types
ts-bind =  { git = "https://github.com/SillyGoose123/ts-bind-no-std"}
#ts-bind = {path = "J:/ts-bind-no-std/crates/ts-bind"}
