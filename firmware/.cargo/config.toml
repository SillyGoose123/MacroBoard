# set default build target for rp2040
[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
runner = 'probe-rs run --chip RP2040'

# use appropriate memory layout
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "no-vectorize-loops",
]

# run cargo clean after changing
[env]
DEFMT_LOG = "info"

[alias]
deploy = "run --config target.thumbv6m-none-eabi.runner=\"elf2uf2-rs\""